spring.application.name=Contrack
spring.datasource.url=jdbc:h2:mem:contrackBD #nome do banco de dados
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.docker.compose.enabled=false

spring.jpa.hibernate.ddl-auto=create-drop
# Console do H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

#Para mockar entidades localmente no main/resources/data.sql
spring.jpa.defer-datasource-initialization=true

# Limite por arquivo individual (ex: 10MB)
spring.servlet.multipart.max-file-size=10MB

# Limite total da requisição (se enviar vários arquivos de uma vez)
spring.servlet.multipart.max-request-size=10MB

